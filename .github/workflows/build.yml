name: Build KrutoGram.dylib
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile
        run: |
          xcrun -sdk iphoneos clang -arch arm64 -miphoneos-version-min=14.0 \
            -dynamiclib -fobjc-arc -framework UIKit -framework Foundation -framework CoreGraphics \
            -install_name @executable_path/KrutoGram.dylib \
            -o KrutoGram.dylib KrutoGram.m
          codesign -f -s - KrutoGram.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: KrutoGram.dylib
          path: KrutoGram.dylib
